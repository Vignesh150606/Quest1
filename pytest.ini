[pytest]
markers =
    network: hits real remote hosts; excluded by default
# --basetemp: on this dev machine, C:\Users\...\Temp\pytest-of-<user> became
# permission-denied at some point after Aug 7 (unrelated to this project -- Windows ACL
# issue, likely from the Docker Desktop install) -- ANY test using the tmp_path fixture
# failed with PermissionError before this, including pre-existing tests, not just new
# ones. Routing pytest's temp dir into the repo (.pytest_tmp/, gitignored) sidesteps the
# broken system temp folder entirely and is also more reproducible: every run starts
# from the same known location instead of wherever the OS temp dir happens to be.
addopts = -m "not network" --basetemp=.pytest_tmp
